# Local stack: PostgreSQL + Redis + the API + the web app, with development sign-in and seed data.
#   docker compose up --build        then open http://localhost:3000
# This is for development. Production uses Neon, Upstash, Firebase sign-in and no dev tools (see backend/README.md).
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: trainmate, POSTGRES_PASSWORD: trainmate, POSTGRES_DB: trainmate }
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U trainmate"], interval: 3s, timeout: 3s, retries: 20 }

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, timeout: 3s, retries: 20 }

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/trainmate
      DB_USER: trainmate
      DB_PASSWORD: trainmate
      REDIS_URL: redis://redis:6379
      AUTH_MODE: dev
      DEV_TOOLS: "true"
      DEV_SEED: "true"
      PROVIDER: ${PROVIDER:-railradar}
      RAILRADAR_API_KEY: ${RAILRADAR_API_KEY:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      PNR_SALT: ${PNR_SALT:-dev_secure_random_salt_12345}
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: ./web
      args:
        BACKEND_URL: http://api:8080
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-dev}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  dbdata:
